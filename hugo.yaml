baseURL: "https://deepak-shakya.space/"
locale: "en-us"
title: "Deepak Shakya's Space"

module:
  imports:
    - path: "github.com/McShelby/hugo-theme-relearn"

params:
  linkTitle: ""
  themeVariant: "relearn-dark"
  logo:
    src: "/avatar.png"
  images:
    - "/og-deepak-shakya.jpg"
  meta:
    favicon: true
  alwaysopen: true
  collapsibleMenu: false
  disableLandingPageButton: true
  search:
    disable: false
    index:
      disable: false
    page:
      disable: true
  socials:
    github: "https://github.com/divinedragon"
    email: "mailto:justdpk+website@gmail.com"
    mastodon: "https://mastodon.world/@divinedragon"
    stackoverflow: "https://stackoverflow.com/users/979772/divinedragon"
    linkedin: "https://www.linkedin.com/in/deepak-shakya/"
  header:
    title: "Deepak Shakya"
    subtitle: "Technologist | AI & Machine Learning Expert | Delivering Performance and Innovation"
markup:
  defaultMarkdownHandler: "goldmark"
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: false
    noClasses: true
    style: "fruity"
    tabWidth: 4

image:
  errorlevel: "error"
link:
  errorlevel: "error"

outputs:
  home:
    - "html"
    - "rss"
    - "print"
  page:
    - "html"
    - "print"
  section:
    - "html"
    - "rss"
    - "print"

security:
  exec:
    allow:
      - "^(dart-)?sass(-embedded)?$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"
      - "^asciidoctor$"
